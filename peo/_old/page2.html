<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PEO Sondas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
body{
    background:#f4f4f4;
}

.field-card{
    background:white;
    padding:12px;
    border-radius:8px;
    margin-bottom:10px;
}

.edit-icon{
    cursor:pointer;
}

#progressModal,
#errorModal{
    position:fixed;
    z-index:99999;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    display:none;
}

.popup-box{
    background:white;
    width:500px;
    max-width:95%;
    padding:20px;
    margin:120px auto;
    border-radius:10px;
}

.table-fixed{
    max-height:220px;
    overflow:auto;
}
</style>
</head>

<body>

<div class="container-fluid mt-3">

<div class="d-flex justify-content-between">
    <h3>PEO Auditoria</h3>

    <div>
        <input type="file" id="excelFile" hidden>
        <button class="btn btn-primary" onclick="document.getElementById('excelFile').click()">
            Importar Excel
        </button>

        <button class="btn btn-secondary" onclick="toggleLanguage()">
            PT/EN
        </button>
    </div>
</div>

<div id="recordArea" class="mt-3"></div>

<h5 class="mt-3">Códigos</h5>

<div class="table-responsive table-fixed">
<table class="table table-bordered table-sm">
    <tbody id="codesTable"></tbody>
</table>
</div>

</div>

<div id="progressModal">
    <div class="popup-box">
        <h5>Convertendo Excel</h5>
        <div class="progress">
            <div id="progressBar"
                 class="progress-bar progress-bar-striped progress-bar-animated"
                 style="width:0%">
                 0%
            </div>
        </div>
    </div>
</div>

<div id="errorModal">
    <div class="popup-box">
        <h5>Erro</h5>
        <pre id="errorText"></pre>
        <button class="btn btn-danger" onclick="closeError()">Fechar</button>
    </div>
</div>

<script src="setup.js"></script>

<script>

window.onerror=function(msg,url,line,col,error){
    try{
        showError(
            msg +
            "\nURL:"+url+
            "\nLinha:"+line+
            "\nColuna:"+col
        );
    }catch(e){}
    return true;
}

document.getElementById("excelFile").addEventListener("change",uploadExcel);

</script>

</body>
</html>
