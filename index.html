<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bolinha Neon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;900&family=Chakra+Petch:wght@400;600&display=swap">
<style>
/* Layout: canvas em tela cheia; HUD fixo no topo; painéis centrais por cima do jogo. Visual único, escuro (arcade neon). */
:root{
  --bg:#060814;
  --bg-2:#0d1328;
  --fg:#eef3ff;
  --muted:#8b96b8;
  --neon:#3dff5a;
  --hot:#ff2438;
  --ice:#96d7ff;
  --white:#ffffff;
  --gold:#ffc93d;
  --panel:rgba(8,12,28,.88);
  --edge:rgba(150,215,255,.16);
  --f-display:"Tektur","Chakra Petch",system-ui,sans-serif;
  --f-body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

.hud{
  position:fixed;top:0;left:0;right:0;z-index:2;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;
}
.label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.phase{display:flex;flex-direction:column;gap:2px}
.phase b{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,5vw,30px);line-height:1;color:var(--fg)}
.phase small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{
  font-family:var(--f-display);font-weight:700;font-size:clamp(34px,9vw,54px);line-height:1;
  font-variant-numeric:tabular-nums;color:var(--fg);text-align:center;
  text-shadow:0 0 18px rgba(150,215,255,.35);
}
.timer.urgent{color:var(--neon);text-shadow:0 0 18px rgba(61,255,90,.6)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.dots{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--edge);transition:background .25s,box-shadow .25s}
.tools{display:flex;gap:6px;pointer-events:auto}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--edge);
  background:rgba(13,19,40,.7);color:var(--fg);font:600 14px var(--f-body);cursor:pointer;
  display:grid;place-items:center;
}
.icon-btn:focus-visible,.btn:focus-visible{outline:2px solid var(--neon);outline-offset:3px}

.overlay{
  position:fixed;inset:0;z-index:3;display:grid;place-items:center;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at center,rgba(6,8,20,.35),rgba(6,8,20,.8));
  overflow-y:auto;touch-action:pan-y;
}
.overlay[hidden]{display:none}
.card{
  width:min(440px,100%);background:var(--panel);border:1px solid var(--edge);border-radius:20px;
  padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);backdrop-filter:blur(6px);
}
.eyebrow{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--neon)}
.card h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,42px);line-height:1.05;text-wrap:balance}
.card h1 .r{color:var(--hot);text-shadow:0 0 22px rgba(255,36,56,.6)}
.card p{margin:0;font-size:15px;line-height:1.5;color:var(--fg)}
.card p.muted{color:var(--muted);font-size:14px}
.rules{display:flex;flex-direction:column;gap:12px;margin:4px 0 2px;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;font-size:14px;line-height:1.4}
.rules li span{min-width:0}
.sw{height:12px;border-radius:6px}
.sw.ramp{background:linear-gradient(90deg,var(--hot),var(--ice) 60%,var(--white));box-shadow:0 0 10px rgba(255,36,56,.4)}
.sw.line{height:4px;background:var(--neon);box-shadow:0 0 10px var(--neon);transform:rotate(-18deg)}
.sw.clock{height:auto;font:700 13px var(--f-display);color:var(--fg);text-align:center}
.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg-2);font-size:14px}
.stat b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.btn{
  margin-top:4px;appearance:none;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;
  background:var(--neon);color:var(--bg);font:700 17px var(--f-display);letter-spacing:.04em;
  box-shadow:0 0 24px rgba(61,255,90,.45);
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--edge);box-shadow:none;font-size:15px;padding:12px 16px}
.btn.alt{background:var(--ice);box-shadow:0 0 24px rgba(150,215,255,.4)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.actions .btn{margin-top:0}
.center{display:flex;flex-direction:column;align-items:center;gap:4px}
.score{font-family:var(--f-display);font-weight:700;font-size:clamp(15px,4vw,19px);color:var(--neon);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(61,255,90,.45)}
.who{font-size:12px;font-weight:600;color:var(--bg);background:var(--ice);border-radius:6px;padding:2px 7px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:flex-start}
.who.p2{background:var(--gold)}
.who[hidden]{display:none}
.fields{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input{appearance:none;border:1px solid var(--edge);background:var(--bg-2);color:var(--fg);border-radius:12px;padding:12px 14px;font:600 16px var(--f-body);user-select:text;-webkit-user-select:text;touch-action:auto}
.field input:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs .side{padding:14px;border-radius:14px;background:var(--bg-2);border:1px solid var(--edge);display:flex;flex-direction:column;gap:4px;min-width:0}
.vs .side.win{border-color:var(--neon);box-shadow:0 0 18px rgba(61,255,90,.3)}
.vs .name{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .pts{font-family:var(--f-display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.vs .meta{font-size:12px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:900;font-size:44px;color:var(--neon);font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(61,255,90,.45);line-height:1}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.points b{color:var(--fg)}
@media (prefers-reduced-motion: reduce){ .dot{transition:none} }
</style>

<canvas id="c" aria-label="Área do jogo: arraste para criar barreiras"></canvas>

<div class="hud" id="hud">
  <div class="phase">
    <span class="who" id="who" hidden></span>
    <span class="label">Fase</span>
    <b id="phase">1</b>
    <small id="speed">velocidade x1,00</small>
  </div>
  <div class="center">
    <div class="timer" id="time" aria-live="off">1:00</div>
    <div class="score" id="score">0 pts</div>
  </div>
  <div class="right">
    <span class="label" id="hitsLbl">Batidas 0/10</span>
    <div class="dots" id="dots"></div>
    <div class="tools">
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Som ligado">♪</button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pausar">II</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const COL = { bg: tok('--bg'), neon: tok('--neon'), edge: tok('--edge') };
  const FONT = tok('--f-display');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const MAX_HITS = 10, PHASE_TIME = 60, GROWTH = 1.2, LINE_HALF = 3, MIN_LEN = 24, GRAV = 1100;
  const RED = [255, 36, 56], ICE = [150, 215, 255], WHITE = [255, 255, 255];

  let W = 0, H = 0, DPR = 1;
  let state = 'menu'; // menu | intro | play | dying | clear | over | paused
  let pausedFrom = null;
  let phase = 1, hits = 0, timeLeft = PHASE_TIME, introT = 0, dyingT = 0, clock = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('bolinha-neon-best'), 10) || 0; } catch (e) {}
  let muted = false;
  try { muted = localStorage.getItem('bolinha-neon-mute') === '1'; } catch (e) {}

  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 12, col: RED.slice() };
  let trail = [];
  let barrier = null;   // { a:{x,y}, b:{x,y}, drawing }
  let drag = null;      // pointerId desenhando
  let shards = [], sparks = [], ripples = [];
  const wallFlash = { l: 0, r: 0, t: 0, b: 0 };
  let shake = 0;

  // pontuação e modos
  let mode = 'solo';          // solo | duo
  let players = [];           // [{ name, score, phase }]
  let turn = 0;
  let score = 0, combo = 0, secAcc = 0, phaseStartScore = 0, rebounds = 0;
  let seed = Math.random() * 1000;
  let floats = [];
  let bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem('bolinha-neon-best-score'), 10) || 0; } catch (e) {}
  let savedNames = ['Jogador 1', 'Jogador 2'];
  try { const n = JSON.parse(localStorage.getItem('bolinha-neon-names') || 'null'); if (Array.isArray(n) && n.length === 2) savedNames = n; } catch (e) {}

  // ---------- util
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  function colorFor(h) {
    const t = clamp(h / MAX_HITS, 0, 1), k = 0.6;
    return t < k ? mix(RED, ICE, t / k) : mix(ICE, WHITE, (t - k) / (1 - k));
  }
  const base = () => Math.max(W, H) * 0.42;
  const mult = p => Math.pow(GROWTH, p - 1);
  const speedFor = p => base() * mult(p);
  const fmtMult = p => 'x' + mult(p).toFixed(2).replace('.', ',');
  const blen = b => Math.hypot(b.b.x - b.a.x, b.b.y - b.a.y);
  const fmt = n => Math.round(n).toLocaleString('pt-BR');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rand01 = s => { const x = Math.sin(s * 12.9898) * 43758.5453; return x - Math.floor(x); };

  function updateScore() { $('score').textContent = fmt(score) + ' pts'; }
  function addPoints(n, x, y, label, gold) {
    score += n; updateScore();
    if (x !== undefined) floats.push({ x, y, text: label || '+' + fmt(n), life: 1, gold: !!gold });
  }

  // ---------- áudio
  let actx = null;
  function ac() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    const a = actx; if (!a || muted) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, hp) {
    const a = actx; if (!a || muted) return;
    const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  }
  const sfxWall = h => tone(150 + h * 48, 0.14, 'triangle', 0.2, 0.55);
  function sfxGlass(soft) {
    noise(soft ? 0.18 : 0.4, soft ? 0.05 : 0.16, 2600);
    const n = soft ? 2 : 5;
    for (let i = 0; i < n; i++) tone(2200 + Math.random() * 3200, 0.22, 'sine', soft ? 0.02 : 0.045, 0, i * 0.035 + Math.random() * 0.02);
  }
  const sfxClear = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.07, 0, i * 0.09));
  const sfxLose = () => { tone(420, 1.1, 'sawtooth', 0.11, 0.2); tone(210, 1.1, 'sine', 0.12, 0.3); };

  // ---------- layout
  function resize() {
    const oldW = W, oldH = H, oldBase = W ? base() : 0;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ball.r = Math.max(10, Math.min(W, H) * 0.028);
    if (oldW && oldH) {
      ball.x = ball.x / oldW * W; ball.y = ball.y / oldH * H;
      const k = base() / oldBase; ball.vx *= k; ball.vy *= k;
    } else { ball.x = W / 2; ball.y = H * 0.55; }
    ball.x = clamp(ball.x, ball.r, W - ball.r); ball.y = clamp(ball.y, ball.r, H - ball.r);
  }
  window.addEventListener('resize', resize);

  // ---------- HUD
  const dotsEl = $('dots');
  const dots = [];
  for (let i = 0; i < MAX_HITS; i++) { const d = document.createElement('span'); d.className = 'dot'; dotsEl.appendChild(d); dots.push(d); }
  let lastSec = -1;
  function updateHUD(force) {
    $('phase').textContent = phase;
    $('speed').textContent = 'velocidade ' + fmtMult(phase);
    $('hitsLbl').textContent = `Batidas ${hits}/${MAX_HITS}`;
    dots.forEach((d, i) => {
      if (i < hits) { const c = colorFor(i + 1); d.style.background = rgba(c); d.style.boxShadow = `0 0 8px ${rgba(c, .8)}`; d.style.borderColor = rgba(c); }
      else { d.style.background = 'transparent'; d.style.boxShadow = 'none'; d.style.borderColor = ''; }
    });
    const s = Math.ceil(timeLeft);
    if (force || s !== lastSec) {
      lastSec = s;
      $('time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      $('time').classList.toggle('urgent', s <= 10 && state !== 'menu');
    }
  }
  const muteBtn = $('muteBtn'), pauseBtn = $('pauseBtn');
  function syncMute() { muteBtn.textContent = muted ? '×' : '♪'; muteBtn.setAttribute('aria-label', muted ? 'Som desligado' : 'Som ligado'); }
  muteBtn.addEventListener('click', () => { muted = !muted; try { localStorage.setItem('bolinha-neon-mute', muted ? '1' : '0'); } catch (e) {} ac(); syncMute(); });
  pauseBtn.addEventListener('click', () => { if (state === 'play' || state === 'intro') pause(); else if (state === 'paused') resume(); });
  syncMute();

  // ---------- painéis
  const ov = $('ov'), card = $('card');
  function show(html, actions) {
    card.innerHTML = html; ov.hidden = false;
    if (typeof actions === 'function') actions = { go: actions };
    card.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { ac(); actions[b.dataset.act](); }));
    const f = card.querySelector('.btn');
    if (f && !card.querySelector('input')) setTimeout(() => f.focus({ preventScroll: true }), 50);
  }
  const POINTS_HELP = `
      <ul class="points">
        <li><b>+10 × fase</b> a cada rebote numa barreira. Rebotes seguidos sem bater no canto multiplicam até x5.</li>
        <li><b>+1 × fase</b> por segundo sobrevivido.</li>
        <li><b>Bônus de fase:</b> 100 × fase, mais 20 × fase por batida que sobrou.</li>
      </ul>`;
  const hide = () => { ov.hidden = true; };

  function showMenu() {
    state = 'menu';
    show(`
      <p class="eyebrow">Jogo de reflexo</p>
      <h1>Bolinha <span class="r">Neon</span></h1>
      <ul class="rules">
        <li><div class="sw ramp"></div><span>Cada batida no canto da tela desbota a bola: do vermelho ao azul claro até o branco. Com 10 batidas ela fica branca e você perde.</span></li>
        <li><div class="sw line"></div><span>Arraste o dedo para traçar uma barreira verde. A bola rebate nela e a barreira se quebra como vidro.</span></li>
        <li><div class="sw clock">60s</div><span>Aguente 1 minuto para passar de fase. A cada fase a bola fica 20% mais rápida.</span></li>
      </ul>
      ${POINTS_HELP}
      ${bestScore ? `<div class="stat"><span>Seu recorde</span><b>${fmt(bestScore)} pts</b></div>` : ''}
      <div class="actions">
        <button class="btn" type="button" data-act="solo">1 jogador</button>
        <button class="btn alt" type="button" data-act="duo">2 jogadores</button>
      </div>`, { solo: startSolo, duo: showDuoSetup });
  }

  function startSolo() {
    mode = 'solo'; players = [{ name: 'Você', score: 0, phase: 0 }]; turn = 0;
    seed = Math.random() * 1000;
    newRun();
  }

  function showDuoSetup() {
    state = 'menu';
    show(`
      <p class="eyebrow">Dois jogadores, um aparelho</p>
      <h1>Quem pontua mais?</h1>
      <p class="muted">Cada um joga uma partida inteira, na sua vez. As duas partidas começam com a bola na mesma direção em cada fase, para ser justo.</p>
      <div class="fields">
        <label class="field" for="name1">Primeiro a jogar<input id="name1" maxlength="16" autocomplete="off" value="${esc(savedNames[0])}"></label>
        <label class="field" for="name2">Segundo a jogar<input id="name2" maxlength="16" autocomplete="off" value="${esc(savedNames[1])}"></label>
      </div>
      <div class="actions">
        <button class="btn" type="button" data-act="go">Começar</button>
        <button class="btn ghost" type="button" data-act="back">Voltar</button>
      </div>`, {
      go: () => {
        const n1 = $('name1').value.trim() || 'Jogador 1', n2 = $('name2').value.trim() || 'Jogador 2';
        savedNames = [n1, n2];
        try { localStorage.setItem('bolinha-neon-names', JSON.stringify(savedNames)); } catch (e) {}
        mode = 'duo'; players = [{ name: n1, score: 0, phase: 0 }, { name: n2, score: 0, phase: 0 }]; turn = 0;
        seed = Math.random() * 1000;
        showTurnIntro();
      },
      back: showMenu
    });
  }

  function showTurnIntro() {
    state = 'menu';
    const p = players[turn];
    const prev = turn === 1 ? `<div class="stat"><span>${esc(players[0].name)} fez</span><b>${fmt(players[0].score)} pts</b></div>` : '';
    show(`
      <p class="eyebrow">Jogador ${turn + 1} de 2</p>
      <h1>Vez de ${esc(p.name)}</h1>
      ${prev}
      <p class="muted">${turn === 1 ? `Passe o aparelho para ${esc(p.name)}. Precisa de ${fmt(players[0].score + 1)} pts para vencer.` : `Passe o aparelho para ${esc(p.name)}.`}</p>
      <button class="btn${turn === 1 ? ' alt' : ''}" type="button" data-act="go">Estou pronto</button>`, newRun);
  }

  function newRun() {
    score = 0; combo = 0; secAcc = 0; rebounds = 0; floats = [];
    updateScore();
    const who = $('who');
    who.hidden = mode !== 'duo';
    if (mode === 'duo') { who.textContent = players[turn].name; who.classList.toggle('p2', turn === 1); }
    startPhase(1);
  }

  function startPhase(p) {
    phase = p; hits = 0; timeLeft = PHASE_TIME; barrier = null; drag = null; combo = 0; secAcc = 0;
    phaseStartScore = score;
    ball.col = RED.slice();
    ball.x = W / 2; ball.y = H * 0.55;
    const q = Math.floor(rand01(seed + phase * 3.3) * 4);
    const ang = (q * 90 + 25 + rand01(seed + phase * 7.1) * 40) * Math.PI / 180;
    const s = speedFor(phase);
    ball.vx = Math.cos(ang) * s; ball.vy = Math.sin(ang) * s;
    trail = [];
    state = 'intro'; introT = 1.6;
    hide(); updateHUD(true);
  }

  function phaseClear() {
    state = 'clear'; barrier = null; drag = null;
    best = Math.max(best, phase + 1);
    try { localStorage.setItem('bolinha-neon-best', String(best)); } catch (e) {}
    const left = MAX_HITS - hits;
    const bonusBase = 100 * phase, bonusHits = left * 20 * phase;
    addPoints(bonusBase + bonusHits);
    sfxClear();
    show(`
      <p class="eyebrow">${mode === 'duo' ? esc(players[turn].name) + ' · ' : ''}60 segundos sobrevividos</p>
      <h1>Fase ${phase} concluída!</h1>
      <div class="big">${fmt(score)} <small style="font-size:18px">pts</small></div>
      <div class="stat"><span>Pontos nesta fase</span><b>+${fmt(score - phaseStartScore)}</b></div>
      <div class="stat"><span>Bônus de fase + ${left} batidas sobrando</span><b>+${fmt(bonusBase + bonusHits)}</b></div>
      <div class="stat"><span>Velocidade na fase ${phase + 1}</span><b>${fmtMult(phase + 1)}</b></div>
      <p class="muted">${left >= 7 ? 'Defesa impecável.' : left >= 3 ? 'Foi por pouco em alguns momentos.' : 'Passou raspando!'} A bola volta a ficar vermelha, mas vai mais rápido.</p>
      <button class="btn" type="button" data-act="go">Próxima fase</button>`, () => startPhase(phase + 1));
  }

  function gameOver() {
    state = 'over';
    best = Math.max(best, phase);
    try { localStorage.setItem('bolinha-neon-best', String(best)); } catch (e) {}
    const record = score > bestScore;
    if (record) { bestScore = score; try { localStorage.setItem('bolinha-neon-best-score', String(bestScore)); } catch (e) {} }
    players[turn].score = score; players[turn].phase = phase;
    $('who').hidden = true;

    if (mode === 'solo') {
      show(`
        <p class="eyebrow">A bola ficou branca</p>
        <h1>Fim de jogo</h1>
        <div class="big">${fmt(score)} <small style="font-size:18px">pts</small></div>
        <div class="stat"><span>Fase alcançada</span><b>${phase} · ${fmtMult(phase)}</b></div>
        <div class="stat"><span>Rebotes em barreiras</span><b>${rebounds}</b></div>
        <div class="stat"><span>Recorde</span><b>${fmt(bestScore)} pts${record && score > 0 ? ' · novo!' : ''}</b></div>
        <div class="actions">
          <button class="btn" type="button" data-act="again">Jogar de novo</button>
          <button class="btn ghost" type="button" data-act="menu">Menu</button>
        </div>`, { again: startSolo, menu: showMenu });
      return;
    }

    if (turn === 0) {
      show(`
        <p class="eyebrow">A bola ficou branca</p>
        <h1>${esc(players[0].name)} fez ${fmt(score)} pts</h1>
        <div class="stat"><span>Fase alcançada</span><b>${phase}</b></div>
        <div class="stat"><span>Rebotes em barreiras</span><b>${rebounds}</b></div>
        <button class="btn alt" type="button" data-act="go">Vez de ${esc(players[1].name)}</button>`,
        () => { turn = 1; showTurnIntro(); });
      return;
    }

    const [a, b] = players;
    const tie = a.score === b.score;
    const w = tie ? -1 : a.score > b.score ? 0 : 1;
    const side = (p, i) => `
      <div class="side${i === w ? ' win' : ''}">
        <span class="name">${esc(p.name)}</span>
        <span class="pts">${fmt(p.score)}</span>
        <span class="meta">pts · fase ${p.phase}</span>
      </div>`;
    if (!tie) sfxClear();
    show(`
      <p class="eyebrow">Resultado</p>
      <h1>${tie ? 'Empate!' : esc(players[w].name) + ' venceu!'}</h1>
      <div class="vs">${side(a, 0)}${side(b, 1)}</div>
      <p class="muted">${tie ? 'Mesma pontuação. Hora do desempate.' : `Diferença de ${fmt(Math.abs(a.score - b.score))} pts.`}</p>
      <div class="actions">
        <button class="btn" type="button" data-act="again">Revanche</button>
        <button class="btn ghost" type="button" data-act="menu">Menu</button>
      </div>`, {
      again: () => { players.forEach(p => { p.score = 0; p.phase = 0; }); turn = 0; seed = Math.random() * 1000; showTurnIntro(); },
      menu: showMenu
    });
  }

  function pause() {
    if (state !== 'play' && state !== 'intro') return;
    pausedFrom = state; state = 'paused'; drag = null;
    if (barrier && barrier.drawing) { barrier.drawing = false; if (blen(barrier) < MIN_LEN) barrier = null; }
    pauseBtn.textContent = '▶'; pauseBtn.setAttribute('aria-label', 'Continuar');
    show(`
      <p class="eyebrow">Fase ${phase} · ${Math.ceil(timeLeft)}s restantes</p>
      <h1>Pausado</h1>
      <div class="stat"><span>Pontos</span><b>${fmt(score)}</b></div>
      <div class="actions">
        <button class="btn" type="button" data-act="go">Continuar</button>
        <button class="btn ghost" type="button" data-act="quit">Sair para o menu</button>
      </div>`, { go: resume, quit: quitToMenu });
  }
  function quitToMenu() {
    state = 'menu'; pausedFrom = null; barrier = null; drag = null; floats = [];
    pauseBtn.textContent = 'II'; pauseBtn.setAttribute('aria-label', 'Pausar');
    $('who').hidden = true; score = 0; hits = 0; timeLeft = PHASE_TIME; updateScore(); updateHUD(true);
    showMenu();
  }
  function resume() {
    if (state !== 'paused') return;
    state = pausedFrom || 'play'; hide();
    pauseBtn.textContent = 'II'; pauseBtn.setAttribute('aria-label', 'Pausar');
    last = performance.now();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // ---------- entrada (barreira)
  function pt(e) { return { x: e.clientX, y: e.clientY }; }
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' && state !== 'intro') return;
    e.preventDefault();
    if (drag !== null) return;
    drag = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    if (barrier) shatter(barrier, null, true);
    const p = pt(e);
    barrier = { a: p, b: { x: p.x, y: p.y }, drawing: true };
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== drag || !barrier) return;
    barrier.b = pt(e);
  });
  function endDrag(e) {
    if (e.pointerId !== drag) return;
    drag = null;
    if (barrier) { barrier.drawing = false; if (blen(barrier) < MIN_LEN) barrier = null; }
  }
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- física
  function segHit(b) {
    const ax = b.a.x, ay = b.a.y, dx = b.b.x - ax, dy = b.b.y - ay;
    const L2 = dx * dx + dy * dy; if (L2 < 1) return null;
    const t = clamp(((ball.x - ax) * dx + (ball.y - ay) * dy) / L2, 0, 1);
    const px = ax + t * dx, py = ay + t * dy;
    let nx = ball.x - px, ny = ball.y - py;
    const d = Math.hypot(nx, ny);
    const reach = ball.r + LINE_HALF;
    if (d >= reach) return null;
    if (d < 1e-6) { const l = Math.sqrt(L2); nx = -dy / l; ny = dx / l; if (nx * ball.vx + ny * ball.vy > 0) { nx = -nx; ny = -ny; } }
    else { nx /= d; ny /= d; }
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn >= 0) return null;
    ball.vx -= 2 * vn * nx; ball.vy -= 2 * vn * ny;
    ball.x = px + nx * (reach + 0.5); ball.y = py + ny * (reach + 0.5);
    return { px, py, nx, ny };
  }

  function stepBall(dt) {
    const sp = Math.hypot(ball.vx, ball.vy);
    const n = Math.max(1, Math.ceil(sp * dt / (ball.r * 0.4)));
    const h = dt / n;
    for (let i = 0; i < n; i++) {
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (barrier && blen(barrier) >= MIN_LEN) {
        const hit = segHit(barrier);
        if (hit) {
          shatter(barrier, hit, false); barrier = null; drag = null;
          combo++; rebounds++;
          const m = Math.min(combo, 5), pts = 10 * phase * m;
          addPoints(pts, hit.px, hit.py, m > 1 ? `+${fmt(pts)} x${m}` : `+${fmt(pts)}`, m > 1);
        }
      }
      let wall = null;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); wall = 'l'; }
      else if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); wall = 'r'; }
      if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); wall = wall || 't'; }
      else if (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); wall = wall || 'b'; }
      if (wall) { wallHit(wall); if (state !== 'play') break; }
    }
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 16) trail.shift();
  }

  function wallHit(w) {
    hits = Math.min(MAX_HITS, hits + 1);
    combo = 0;
    wallFlash[w] = 1;
    const c = colorFor(hits);
    ripples.push({ x: ball.x, y: ball.y, r: ball.r, life: 1, col: c });
    if (!reduceMotion) shake = Math.min(10, 3 + hits * 0.6);
    sfxWall(hits);
    updateHUD();
    if (hits >= MAX_HITS) {
      state = 'dying'; dyingT = 1.4; barrier = null; drag = null;
      sfxLose();
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 420;
        sparks.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, col: WHITE, len: 10 });
      }
    }
  }

  function shatter(b, hit, soft) {
    const dx = b.b.x - b.a.x, dy = b.b.y - b.a.y, L = Math.hypot(dx, dy);
    if (L < 2) return;
    const ux = dx / L, uy = dy / L;
    let nx = -uy, ny = ux, ix = b.a.x + dx / 2, iy = b.a.y + dy / 2;
    if (hit) { ix = hit.px; iy = hit.py; nx = -hit.nx; ny = -hit.ny; }
    const N = clamp(Math.round(L / 12), 6, 48), seg = L / N;
    for (let i = 0; i < N; i++) {
      const along = seg * (i + 0.5);
      const cx = b.a.x + ux * along, cy = b.a.y + uy * along;
      const k = Math.random() < 0.5 ? 3 : 4, pts = [];
      for (let j = 0; j < k; j++) {
        const s = (Math.random() - 0.5) * seg * 1.3;
        const w = (j % 2 ? 1 : -1) * (1.5 + Math.random() * 5);
        pts.push({ x: ux * s + nx * w, y: uy * s + ny * w });
      }
      const dist = Math.hypot(cx - ix, cy - iy);
      const f = hit ? Math.max(0, 1 - dist / 240) : 0;
      const side = Math.sign((cx - ix) * ux + (cy - iy) * uy) || (Math.random() < 0.5 ? -1 : 1);
      const power = soft ? 40 : 90 + 320 * f;
      shards.push({
        x: cx, y: cy, pts, rot: 0, vr: (Math.random() - 0.5) * (soft ? 4 : 14),
        vx: nx * power + ux * side * 160 * f + (Math.random() - 0.5) * 90,
        vy: ny * power + uy * side * 160 * f - Math.random() * (soft ? 30 : 140),
        a: 1
      });
    }
    if (!soft) {
      for (let i = 0; i < 18; i++) {
        const a = Math.atan2(ny, nx) + (Math.random() - 0.5) * 2.2, s = 150 + Math.random() * 380;
        sparks.push({ x: ix, y: iy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, col: [190, 255, 200], len: 7 });
      }
    }
    sfxGlass(soft);
  }

  function updateFx(dt) {
    for (const s of shards) {
      s.vy += GRAV * dt; s.vx *= 0.995;
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
      const fadeStart = H * 0.7;
      s.a = Math.min(s.a, s.y > fadeStart ? clamp((H + 30 - s.y) / (H - fadeStart + 30), 0, 1) : 1);
      s.a -= dt * 0.12;
    }
    shards = shards.filter(s => s.a > 0.01 && s.y < H + 60 && s.x > -80 && s.x < W + 80);
    for (const p of sparks) { p.vy += GRAV * 0.35 * dt; p.vx *= 0.98; p.vy *= 0.98; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.8; }
    sparks = sparks.filter(p => p.life > 0);
    for (const r of ripples) { r.r += dt * (180 + ball.r * 6); r.life -= dt * 1.7; }
    ripples = ripples.filter(r => r.life > 0);
    for (const f of floats) { f.y -= dt * 60; f.life -= dt * 0.9; }
    floats = floats.filter(f => f.life > 0);
    for (const k in wallFlash) wallFlash[k] *= Math.exp(-5 * dt);
    shake *= Math.exp(-9 * dt);
    const target = colorFor(hits);
    ball.col = mix(ball.col, target, 1 - Math.exp(-8 * dt));
  }

  function update(dt) {
    clock += dt;
    updateFx(dt);
    if (state === 'intro') { introT -= dt; if (introT <= 0) state = 'play'; }
    else if (state === 'play') {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; updateHUD(true); phaseClear(); }
      else {
        secAcc += dt;
        while (secAcc >= 1) { secAcc -= 1; addPoints(phase); }
        stepBall(dt);
      }
    } else if (state === 'dying') { dyingT -= dt; if (dyingT <= 0) gameOver(); }
    if (state === 'play' || state === 'intro') updateHUD();
  }

  // ---------- desenho
  function drawGrid() {
    ctx.strokeStyle = COL.edge; ctx.lineWidth = 1; ctx.globalAlpha = 0.35;
    const g = Math.max(40, Math.min(W, H) / 9);
    ctx.beginPath();
    for (let x = (W % g) / 2; x < W; x += g) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = (H % g) / 2; y < H; y += g) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  function drawWalls() {
    const c = ball.col, th = 28;
    const edges = [['l', 0, 0, th, H, 1, 0], ['r', W - th, 0, th, H, -1, 0], ['t', 0, 0, W, th, 0, 1], ['b', 0, H - th, W, th, 0, -1]];
    for (const [k, x, y, w, h, gx, gy] of edges) {
      const f = 0.12 + wallFlash[k] * 0.9;
      const x0 = gx > 0 ? 0 : gx < 0 ? W : 0, y0 = gy > 0 ? 0 : gy < 0 ? H : 0;
      const grad = ctx.createLinearGradient(x0, y0, x0 + gx * th, y0 + gy * th);
      grad.addColorStop(0, rgba(c, f)); grad.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = grad; ctx.fillRect(x, y, w, h);
    }
  }

  function drawBarrier(b) {
    const L = blen(b);
    ctx.lineCap = 'round';
    if (L < MIN_LEN) {
      ctx.setLineDash([4, 6]); ctx.strokeStyle = COL.neon; ctx.globalAlpha = 0.6; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.a.x, b.a.y); ctx.lineTo(b.b.x, b.b.y); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1; return;
    }
    const pulse = 0.8 + 0.2 * Math.sin(clock * 12);
    ctx.save();
    ctx.shadowColor = COL.neon; ctx.shadowBlur = 26;
    ctx.strokeStyle = COL.neon; ctx.globalAlpha = 0.35 * pulse; ctx.lineWidth = LINE_HALF * 3.4;
    ctx.beginPath(); ctx.moveTo(b.a.x, b.a.y); ctx.lineTo(b.b.x, b.b.y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = LINE_HALF * 1.5; ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(230,255,235,.9)'; ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }

  function drawShards() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round';
    for (const s of shards) {
      const cs = Math.cos(s.rot), sn = Math.sin(s.rot);
      ctx.beginPath();
      s.pts.forEach((p, i) => { const x = s.x + p.x * cs - p.y * sn, y = s.y + p.x * sn + p.y * cs; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.closePath();
      ctx.fillStyle = `rgba(61,255,90,${0.22 * s.a})`; ctx.fill();
      ctx.strokeStyle = `rgba(185,255,195,${0.9 * s.a})`; ctx.lineWidth = 1; ctx.stroke();
    }
    for (const p of sparks) {
      ctx.strokeStyle = rgba(p.col, Math.max(0, p.life)); ctx.lineWidth = 1.6;
      const sp = Math.hypot(p.vx, p.vy) || 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx / sp * p.len * p.life, p.y - p.vy / sp * p.len * p.life); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBall() {
    const c = ball.col;
    for (let i = 0; i < trail.length; i++) {
      const k = i / trail.length;
      ctx.fillStyle = rgba(c, 0.28 * k);
      ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, ball.r * (0.35 + 0.6 * k), 0, Math.PI * 2); ctx.fill();
    }
    let r = ball.r;
    if (state === 'dying') r *= 1 + 0.25 * Math.sin(clock * 30) * (dyingT / 1.4);
    if (state === 'intro') r *= 1 + 0.08 * Math.sin(clock * 8);
    ctx.save();
    ctx.shadowColor = rgba(c, 1); ctx.shadowBlur = r * 2.6;
    const g = ctx.createRadialGradient(ball.x - r * 0.35, ball.y - r * 0.35, r * 0.1, ball.x, ball.y, r);
    g.addColorStop(0, rgba(mix(c, WHITE, 0.75)));
    g.addColorStop(0.45, rgba(c));
    g.addColorStop(1, rgba(mix(c, [0, 0, 0], 0.25)));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    for (const rp of ripples) {
      ctx.strokeStyle = rgba(rp.col, rp.life * 0.8); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
    }
    if (state === 'dying') {
      const t = 1 - dyingT / 1.4;
      ctx.strokeStyle = `rgba(255,255,255,${1 - t})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, r + t * Math.max(W, H) * 0.6, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawFloats() {
    if (!floats.length) return;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(clamp(Math.min(W, H) * 0.045, 16, 24))}px ${FONT}`;
    for (const f of floats) {
      const x = clamp(f.x, 50, W - 50), y = clamp(f.y, 30, H - 20);
      ctx.globalAlpha = clamp(f.life * 1.4, 0, 1);
      ctx.fillStyle = f.gold ? '#ffc93d' : '#3dff5a';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14;
      ctx.fillText(f.text, x, y);
    }
    ctx.restore();
  }

  function drawIntro() {
    const t = clamp(introT / 1.6, 0, 1);
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 2.2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#eef3ff';
    ctx.shadowColor = 'rgba(255,36,56,.7)'; ctx.shadowBlur = 24;
    ctx.font = `900 ${Math.round(Math.min(W, H) * 0.14)}px ${FONT}`;
    ctx.fillText(`FASE ${phase}`, W / 2, H * 0.36);
    ctx.shadowBlur = 0; ctx.fillStyle = '#8b96b8';
    ctx.font = `600 ${Math.round(clamp(Math.min(W, H) * 0.04, 14, 20))}px ${FONT}`;
    ctx.fillText(phase === 1 ? 'Arraste o dedo para criar barreiras' : `Velocidade ${fmtMult(phase)}`, W / 2, H * 0.36 + Math.min(W, H) * 0.11);
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawGrid();
    drawWalls();
    if (barrier) drawBarrier(barrier);
    drawShards();
    if (state !== 'menu') drawBall();
    drawFloats();
    if (state === 'intro') drawIntro();
    ctx.restore();
  }

  // ---------- loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state !== 'paused') update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // tela inicial com a bolinha passeando ao fundo
  resize();
  ball.vx = speedFor(1) * 0.6; ball.vy = speedFor(1) * 0.45;
  const menuDrift = () => {
    if (state === 'menu') {
      ball.x += ball.vx / 60; ball.y += ball.vy / 60;
      if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
      if (ball.y < ball.r || ball.y > H - ball.r) ball.vy *= -1;
      ball.x = clamp(ball.x, ball.r, W - ball.r); ball.y = clamp(ball.y, ball.r, H - ball.r);
    }
  };
  const _draw = draw;
  draw = function () { menuDrift(); _draw(); if (state === 'menu') drawBall(); };
  updateHUD(true);
  showMenu();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
